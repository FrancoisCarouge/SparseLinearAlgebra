  <line class="mirror" x1="3" y1="3" x2="49" y2="49" stroke="#59636e" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text class="text" x="80" y="31" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2328">→ true</text>
  <text class="text" x="112" y="31" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2328"></text>
