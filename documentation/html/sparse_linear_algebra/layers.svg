<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" width="880" height="528" role="img" aria-labelledby="title description" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <title id="title">Where Sparse Linear Algebra sits in the technical stack</title>
  <desc id="description">The application sits on top, optionally through typed linear algebra or state estimation libraries. Sparse Linear Algebra is the layer below them. It builds on compile-time computation and the freestanding C++ language alone, without dependency, and it stores arithmetic element types.</desc>
  <style>
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #3d444d; }
      .layer { fill: #151b23; stroke: #3d444d; }
      .ink { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .link { stroke: #9198a1; }
      .accent { fill: #238636; }
    }
  </style>

  <rect class="card" x="0.5" y="0.5" width="879" height="527" rx="10" fill="#ffffff" stroke="#d1d9e0"/>

  <!-- Application -->
  <rect class="layer" x="24" y="24" width="832" height="60" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="ink" x="40" y="49" font-size="15" font-weight="600" fill="#1f2328">Application</text>
  <text class="muted" x="40" y="69" font-size="12" fill="#59636e">structure known before the program runs</text>
  <text class="ink" x="840" y="49" font-size="13" text-anchor="end" fill="#1f2328">estimation · guidance, navigation, and control · robotics</text>
  <text class="ink" x="840" y="69" font-size="13" text-anchor="end" fill="#1f2328">embedded real-time control · simulation · finite difference stencils</text>

  <!-- Optional libraries -->
  <rect class="layer" x="24" y="92" width="832" height="60" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="ink" x="40" y="117" font-size="15" font-weight="600" fill="#1f2328">Typed Linear Algebra · Kalman</text>
  <text class="muted" x="40" y="137" font-size="12" fill="#59636e">optional strongly-typed elements and state estimation, planned</text>
  <text class="ink" x="840" y="127" font-size="13" text-anchor="end" fill="#1f2328">units · axes · frames · filters</text>

  <!-- Sparse Linear Algebra -->
  <rect class="accent" x="24" y="168" width="832" height="100" rx="6" fill="#1a7f37"/>
  <text x="40" y="199" font-size="19" font-weight="700" fill="#ffffff">Sparse Linear Algebra</text>
  <text x="40" y="225" font-size="13" fill="#ffffff">Compile-time sparsity patterns: structural zeros are neither stored nor computed.</text>
  <text x="40" y="247" font-size="13" fill="#ffffff">A write to a structural zero is a compile error. No allocation, no exception.</text>
  <text x="840" y="195" font-size="11" text-anchor="end" fill="#ffffff" fill-opacity="0.8">pattern algebra</text>
  <text x="840" y="213" font-size="13" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">f * p * transposed(f)</text>
  <text x="840" y="235" font-size="11" text-anchor="end" fill="#ffffff" fill-opacity="0.8">element access</text>
  <text x="840" y="253" font-size="13" text-anchor="end" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">value.at&lt;1, 2&gt;()</text>

  <!-- Composition links -->
  <line class="link" x1="44" y1="268" x2="44" y2="308" stroke="#59636e" stroke-width="1.5"/>
  <text class="muted" x="56" y="293" font-size="12" fill="#59636e">builds on the language alone, without dependency</text>
  <line class="link" x1="660" y1="268" x2="660" y2="308" stroke="#59636e" stroke-width="1.5"/>
  <text class="muted" x="672" y="293" font-size="12" fill="#59636e">stores arithmetic elements</text>

  <!-- Language layers -->
  <rect class="layer" x="24" y="308" width="600" height="60" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="ink" x="40" y="333" font-size="15" font-weight="600" fill="#1f2328">Compile-time computation</text>
  <text class="muted" x="40" y="353" font-size="12" fill="#59636e">result patterns, arithmetic terms</text>
  <text class="ink" x="608" y="343" font-size="13" text-anchor="end" fill="#1f2328">consteval · constexpr · template parameters</text>

  <rect class="layer" x="24" y="376" width="600" height="60" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="ink" x="40" y="401" font-size="15" font-weight="600" fill="#1f2328">Fundamentals</text>
  <text class="muted" x="40" y="421" font-size="12" fill="#59636e">in-place storage, row-major order</text>
  <text class="ink" x="608" y="411" font-size="13" text-anchor="end" fill="#1f2328">std::array · std::size_t · concepts</text>

  <rect class="layer" x="24" y="444" width="600" height="60" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="ink" x="40" y="469" font-size="15" font-weight="600" fill="#1f2328">Platform</text>
  <text class="muted" x="40" y="489" font-size="12" fill="#59636e">hosted or freestanding, real-time</text>
  <text class="ink" x="608" y="479" font-size="13" text-anchor="end" fill="#1f2328">C++26 · microcontrollers · desktops · servers</text>

  <!-- Element types -->
  <rect class="layer" x="640" y="308" width="216" height="196" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="ink" x="656" y="333" font-size="15" font-weight="600" fill="#1f2328">Element types</text>
  <text class="muted" x="656" y="353" font-size="12" fill="#59636e">arithmetic, stored in place</text>
  <text class="ink" x="656" y="387" font-size="13" fill="#1f2328">double</text>
  <text class="ink" x="656" y="411" font-size="13" fill="#1f2328">float</text>
  <text class="ink" x="656" y="435" font-size="13" fill="#1f2328">int</text>
  <text class="ink" x="656" y="459" font-size="13" fill="#1f2328">built-in types</text>
</svg>
